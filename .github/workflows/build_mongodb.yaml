name: Build MongoDB image
permissions:
  contents: read

on:
  push:
    branches:
      - 0.118.0-atlantis
    paths:
      - '.github/workflows/build_mongodb.yaml'
      - 'docker/mongodb/Dockerfile'

jobs:
  build_mongodb:
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build_docker.yaml
    with:
      image_file: docker/mongodb/Dockerfile
      image_name: kanisterio/mongodb-yaron
      image_tag: 0.118.0-atlantis
      extra_tags: ""
      ref:  0.118.0-atlantis
      ## Only amd64 platform is supported
      # platforms: ${{ env.PLATFORMS }}
      platforms: linux/amd64
      build-args: |
        TOOLS_IMAGE=ghcr.io/kanisterio/kanister-tools:0.118.0-atlantis
      labels: |
        org.opencontainers.image.title=kanister mongodb
        org.opencontainers.image.description=Image for kanister mongodb example blueprints